[package]
name = "m2-audio"
description = "The client's sound manager (neoeter/src/audio) on bevy_audio: 2D/3D sounds, music fades and volumes (docs/bevy-port-plan.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
m2-assets.workspace = true
m2-formats.workspace = true
# The decoders bevy_audio plays through; enabled here instead of through
# Bevy's `wav`/`mp3` features so that `AudioLoader` does not claim the
# extensions (`M2SoundLoader` validates the data, Bevy's loader does not).
rodio.workspace = true
thiserror = "2.0.21"
