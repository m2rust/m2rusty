[package]
name = "m2-ui"
description = "The game's user interface in Rust: login, character select and the in-game windows (replaces the Python UI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
# egui for the first screens; bevy_ui is the long-term toolkit (pure Rust, all targets).
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts"] }
m2-assets.workspace = true
m2-game.workspace = true
m2-net.workspace = true
