[package]
name = "m2-viewer"
description = "Asset viewer: browse packs, show models, motions, trees (docs/bevy-port-plan.md, phase 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bevy.workspace = true
# UI toolkit: egui (pure Rust; desktop, wasm, Android, iOS). bevy_egui 0.43 targets Bevy 0.20.
# The clipboard feature (arboard) has no Android/iOS/wasm backend, so it is desktop-only below.
bevy_egui = { version = "0.43.1", default-features = false, features = ["render", "default_fonts", "open_url"] }
m2-formats.workspace = true
m2-assets.workspace = true
m2-render.workspace = true

[features]
# Faster iterative links after the first Bevy dylib build. Release packagers
# that need a self-contained binary can build with `--no-default-features`.
default = ["dynamic-linking"]
dynamic-linking = ["bevy/dynamic_linking"]

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
bevy_egui = { version = "0.43.1", default-features = false, features = ["manage_clipboard"] }
