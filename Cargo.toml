# Rust port of the client (docs/bevy-port-plan.md). Lives next to the CMake
# build; crates/m2-script builds the C++ Python host through CMake.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
# Pinned for the whole port; upgrades are a deliberate, separate change.
bevy = "=0.20.1"
cmake = "0.1.58"
# Stored + deflate, as the client's packs use; zlib-rs keeps it pure Rust.
zip = { version = "9.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3.27.0"
# Same version as bevy_audio uses; only the decoders the client data needs
# (PCM `.wav`, `.mp3`).
rodio = { version = "0.22", default-features = false, features = ["symphonia-wav", "symphonia-pcm", "symphonia-mp3"] }

m2-assets = { path = "crates/m2-assets" }
m2-audio = { path = "crates/m2-audio" }
m2-effect = { path = "crates/m2-effect" }
m2-formats = { path = "crates/m2-formats" }
m2-game = { path = "crates/m2-game" }
m2-net = { path = "crates/m2-net" }
m2-render = { path = "crates/m2-render" }
m2-script = { path = "crates/m2-script" }
m2-ui = { path = "crates/m2-ui" }
m2-world = { path = "crates/m2-world" }

# Keep development and test builds quick, including their dependencies.
[profile.dev]
opt-level = 0
debug = 0
incremental = true
codegen-units = 256
